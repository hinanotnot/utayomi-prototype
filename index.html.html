<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うたよみー v0.8</title>
<style>
:root{--sky:#38bff3;--home:#fffaf0;--mountain:#b7ca68;--accent:#f28c28;--ink:#111}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--home)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222;overflow-x:hidden}
.app{min-height:100dvh;background:var(--home);padding-bottom:74px}
header{position:sticky;top:0;z-index:10;background:var(--sky)}
.sky{height:168px;position:relative;overflow:hidden;background:var(--sky)}
.logo{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:40px;line-height:1;font-weight:900;letter-spacing:.02em;color:#000;white-space:nowrap}
.cloud,.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:999px}
.cloud{width:72px;height:25px;top:72px;left:-26px}
.cloud:before{width:34px;height:34px;left:12px;top:-16px}
.cloud:after{width:42px;height:42px;left:34px;top:-21px}
.cloud.right{left:auto;right:-14px;top:54px}
.land{position:absolute;left:0;right:0;bottom:0;height:66px;pointer-events:none}
.land-shape{position:absolute;bottom:-13px;border:4px solid var(--ink);border-bottom:0;z-index:2}
.friend-land{left:-13%;width:64%;height:88px;background:var(--home);border-radius:58% 68% 0 0 / 86% 86% 0 0}
.walk-land{right:-10%;width:58%;height:74px;background:var(--mountain);border-radius:70% 64% 0 0 / 88% 88% 0 0}
.tabs{position:absolute;left:0;right:0;bottom:4px;display:grid;grid-template-columns:1fr 1fr;z-index:3}
.tab{border:0;background:transparent;font-size:20px;font-weight:800;color:#222;opacity:.48;padding:12px 0 8px;-webkit-tap-highlight-color:transparent;outline:none;transition:opacity .18s ease,transform .18s ease}
.tab.active{opacity:1}
.tab.active::after{content:"";display:block;width:76%;height:4px;margin:7px auto -3px;background:var(--accent)}
.tab:active{transform:translateY(1px) scale(.985)}
.tab:focus,.tab:focus-visible{outline:none;box-shadow:none}
.main{background:var(--home);transition:background .2s ease;padding:18px 0 88px}
.main.walk{background:var(--mountain)}
.greet{display:flex;justify-content:center;align-items:center;gap:12px;margin:0 auto 18px}
.miso{width:46px;height:46px;border-radius:50%;background:#ffd86a;flex:0 0 auto}
.bubble{background:#fff;padding:12px 20px;border-radius:999px;font-size:18px;box-shadow:0 6px 14px rgba(0,0,0,.10);white-space:nowrap}
.card{width:min(76vw,360px);aspect-ratio:1/1;margin:0 auto 20px;background:#fff;border:2.5px solid var(--ink);border-radius:20px;overflow:hidden}
.photo{height:10%;background:radial-gradient(circle at 20% 60%,#fff 0 4%,transparent 5%),radial-gradient(circle at 55% 50%,#f7f7f7 0 3%,transparent 4%),linear-gradient(135deg,#70c56b,#d8efb0)}
.tanka{height:80%;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:upright;font-size:22px;line-height:1.75;font-weight:800;letter-spacing:.08em}
.info{height:10%;display:flex;align-items:center;justify-content:space-around;font-size:18px}
.peek{width:min(76vw,360px);height:92px;margin:0 auto;border-radius:20px 20px 0 0;background:rgba(255,255,255,.35)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);padding:7px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.08)}
nav div{text-align:center;font-size:16px;line-height:1.18}
nav .icon{display:block;font-size:25px;margin-bottom:1px}
@media(min-width:430px){.card,.peek{width:min(72vw,380px)}}
@media(max-width:390px){
  .sky{height:158px}.logo{font-size:37px;top:21px}.cloud{top:70px}.cloud.right{top:52px}.land{height:62px}.friend-land{height:82px}.walk-land{height:70px}.tab{font-size:19px}.bubble{font-size:17px;padding:11px 18px}.tanka{font-size:21px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="sky">
    <div class="cloud"></div><div class="cloud right"></div>
    <div class="logo">うたよみー</div>
    <div class="land"><div class="land-shape friend-land"></div><div class="land-shape walk-land"></div></div>
    <div class="tabs"><button class="tab active" data-home="friend">ともだち</button><button class="tab" data-home="walk">おさんぽ</button></div>
  </div>
</header>
<main id="main" class="main">
  <section id="friend" class="panel">
    <div class="greet"><div class="miso"></div><div class="bubble">今日はどんな一日だった？</div></div>
    <article class="card"><div class="photo"></div><div class="tanka">風吹けば　小さな帽子　追いかけて　笑う背中に　春が駆けゆく</div><div class="info"><span>♡12</span><span>💬 3</span></div></article>
    <div class="peek"></div>
  </section>
  <section id="walk" class="panel" hidden>
    <div class="greet"><div class="miso"></div><div class="bubble">季節のうたを探しに行こう。</div></div>
    <article class="card"><div class="photo"></div><div class="tanka">雨あがり　空を映して　水たまり　今日の一首を　連れて帰ろう</div><div class="info"><span>♡8</span><span>💬 1</span></div></article>
    <div class="peek"></div>
  </section>
</main>
<nav><div><span class="icon">🔍</span>さがす</div><div><span class="icon">✍️</span>詠む</div><div><span class="icon">📚</span>アルバム</div></nav>
</div>
<script>
const main=document.getElementById("main");
const tabs=[...document.querySelectorAll(".tab")];
const panels={friend:document.getElementById("friend"),walk:document.getElementById("walk")};
tabs.forEach(tab=>{tab.addEventListener("click",()=>{const home=tab.dataset.home;tabs.forEach(t=>t.classList.toggle("active",t===tab));Object.entries(panels).forEach(([key,panel])=>panel.hidden=key!==home);main.classList.toggle("walk",home==="walk");});});
</script>
</body>
</html>
