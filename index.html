<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#38bff3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="うたよみー">
  <link rel="manifest" href="manifest.webmanifest">
  <title>うたよみー v1.8</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app friend-mode">
  <header class="header">
    <div class="sky">
      <div class="cloud cloud-left"></div>
      <div class="cloud cloud-right"></div>
      <div class="logo">うたよみー</div>

      <img id="landscape" class="landscape" src="landscape-friend.svg" alt="">

      <div class="tabs">
        <button class="tab active" data-home="friend">ともだち</button>
        <button class="tab" data-home="walk">おさんぽ</button>
      </div>
    </div>
  </header>

  <main id="main" class="main">
    <section id="friend" class="panel">
      <div class="greet">
        <div class="miso"></div>
        <div class="bubble">今日はどんな一日だった？</div>
      </div>
      <article class="card">
        <div class="photo photo-spring"></div>
        <div class="tanka"><div class="tanka-line">風吹けば<br>小さな帽子<br>追いかけて</div><div class="tanka-line">笑う背中に<br>春が駆けゆく</div></div>
        <div class="info"><span>♡ 12</span><span>💬 3</span></div>
      </article>
      <div class="peek"></div>
    </section>

    <section id="walk" class="panel" hidden>
      <div class="greet">
        <div class="miso"></div>
        <div class="bubble">季節のうたを探しに行こう。</div>
      </div>
      <article class="card">
        <div class="photo photo-green"></div>
        <div class="tanka"><div class="tanka-line">雨あがり<br>空を映して<br>水たまり</div><div class="tanka-line">今日の一首を<br>連れて帰ろう</div></div>
        <div class="info"><span>♡ 8</span><span>💬 1</span></div>
      </article>
      <div class="peek"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <div><span class="icon">🔍</span>さがす</div>
    <div><span class="icon">✍️</span>詠む</div>
    <div><span class="icon">📚</span>アルバム</div>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
